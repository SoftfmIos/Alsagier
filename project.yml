name: Alsagier
options:
  bundleIdPrefix: com.softfm
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  Alsagier:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: .
        excludes:
          - README.md
          - codemagic.yaml
          - project.yml
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.softfm.alsagierapp
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Alsagier.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
    scheme:
      testTargets: []
