workflows:
  alsagier-v4-testflight:
    name: Alsagier V4.3 TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Alsagier
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.softfm.alsagierapp
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen || true
      - name: Generate project
        script: xcodegen generate
      - name: Apply signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa --project "Alsagier.xcodeproj" --scheme "Alsagier"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
