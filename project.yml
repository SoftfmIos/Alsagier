name: Alsagier
options:
  bundleIdPrefix: com.softfm

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "5.1"
    CURRENT_PROJECT_VERSION: "9"

targets:
  Alsagier:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - AlsagierApp.swift
      - AlsagierActivityAttributes.swift
      - AppStore.swift
      - CalendarManager.swift
      - HabitsView.swift
      - HealthManager.swift
      - LiveActivityManager.swift
      - MainTabView.swift
      - Models.swift
      - MoreView.swift
      - NotificationManager.swift
      - PrayerManager.swift
      - ProjectsView.swift
      - TasksView.swift
      - TodayView.swift
      - path: Assets.xcassets
        buildPhase: resources
      - path: PrayerChime.wav
        buildPhase: resources
    dependencies:
      - target: AlsagierLiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.softfm.alsagierapp
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Alsagier.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"

  AlsagierLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - AlsagierLiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.softfm.alsagierapp.liveactivity
        INFOPLIST_FILE: AlsagierLiveActivity/Info.plist
        SKIP_INSTALL: YES
        SWIFT_VERSION: "5.0"
